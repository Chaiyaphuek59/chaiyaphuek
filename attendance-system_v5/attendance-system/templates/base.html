<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f3">
  <title>{% block title %}Attendance Space{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink:'#082b2d', pine:'#00614b', paper:'#f7f8f3', line:'#ced8d1', gold:'#d89a2b' }, fontFamily: { sans:['Noto Sans Thai','Tahoma','sans-serif'] } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="bg-paper text-ink antialiased">
  <header class="border-b border-line/80 bg-paper/95 sticky top-0 z-30 backdrop-blur">
    <div class="mx-auto flex max-w-[1380px] items-center justify-between gap-4 px-5 py-4 lg:px-8">
      <a href="/student" class="flex items-center gap-3 font-bold" aria-label="Attendance Space">
        <span class="grid h-10 w-10 place-items-center rounded-md bg-pine text-white"><i data-lucide="scan-face" class="h-6 w-6"></i></span>
        <span><span class="block text-[11px] font-semibold uppercase tracking-[0.2em] text-pine">Attendance</span><span class="block leading-none">SPACE</span></span>
      </a>
      <nav class="flex items-center gap-1 rounded-md border border-line bg-white p-1 text-sm font-semibold" aria-label="เมนูหลัก">
        <a href="/student" class="nav-link {% if page == 'student' %}active{% endif %}"><i data-lucide="graduation-cap"></i><span>นักศึกษา</span></a>
        <a href="/teacher" class="nav-link {% if page == 'teacher' %}active{% endif %}"><i data-lucide="presentation"></i><span>อาจารย์</span></a>
        <a href="/admin" class="nav-link {% if page == 'admin' %}active{% endif %}"><i data-lucide="shield-check"></i><span>ผู้ดูแล</span></a>
        {% if teacher or admin %}<button id="staff-logout-button" type="button" class="nav-link" title="ออกจากระบบ"><i data-lucide="log-out"></i><span>ออกจากระบบ</span></button>{% elif student %}<button id="logout-button" type="button" class="nav-link" title="ออกจากระบบ"><i data-lucide="log-out"></i><span>ออกจากระบบ</span></button>{% endif %}
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-[1380px] px-5 py-8 lg:px-8 lg:py-10">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 translate-y-4 rounded-md bg-ink px-5 py-3 text-sm font-semibold text-white opacity-0 shadow-xl transition-all" role="status"></div>
</body>
</html>
